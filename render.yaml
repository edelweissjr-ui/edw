# Publicação do Alinha no Render (render.com) — "New > Blueprint" e escolha este repositório.
services:
  - type: web
    name: alinha-weiss
    runtime: node
    rootDir: alinha
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /saude
    plan: starter            # plano pago: sempre ligado e com disco para guardar os pacientes
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SENHA_ACESSO
        sync: false          # a senha que a equipe digita
      - key: SEGREDO_SESSAO
        generateValue: true
      - key: PASTA_DADOS
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false          # chave da IA (console.anthropic.com)
      - key: KOMMO_SUBDOMINIO
        value: edelweissjrhotmailcom
      - key: KOMMO_TOKEN
        sync: false          # opcional: para enviar o briefing ao Kommo
