# Publicação do Alinha no Render (render.com) — "New > Blueprint" e escolha este repositório.
services:
  - type: web
    name: alinha-weiss
    runtime: node
    rootDir: alinha
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /saude
    autoDeploy: true         # cada nova versão enviada ao repositório é instalada sozinha (os dados ficam no disco)
    plan: starter            # plano pago: sempre ligado e com disco para guardar os pacientes
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SENHA_ACESSO
        sync: false          # senha da equipe (usuário: equipe)
      - key: SENHA_ADMIN
        sync: false          # senha do administrador (usuário: admin)
      - key: SEGREDO_SESSAO
        generateValue: true
      - key: PASTA_DADOS
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false          # chave da IA (console.anthropic.com)
      - key: MODELO_DICAS
        sync: false          # opcional: claude-haiku-5-5 deixa as dicas ao vivo mais rápidas e baratas
      - key: KOMMO_SUBDOMINIO
        value: edelweissjrhotmailcom
      - key: KOMMO_TOKEN
        sync: false          # token de longa duração do Kommo (briefing, nome/unidade do lead, pausar a IA)
      - key: KOMMO_CHAVE_WEBHOOK
        generateValue: true  # entra no endereço do webhook de mensagens do WhatsApp
