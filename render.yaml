# Publicação do Copiloto Weiss no Render (render.com) — "New > Blueprint" e escolha este repositório.
services:
  - type: web
    name: copiloto-weiss
    runtime: node
    rootDir: consulta
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /saude
    plan: starter            # plano pago: fica sempre ligado (necessário para receber o WhatsApp do Kommo)
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SENHA_ACESSO
        sync: false          # você digita no painel: a senha da equipe
      - key: SEGREDO_SESSAO
        generateValue: true
      - key: PASTA_DADOS
        value: /var/data
      - key: KOMMO_SUBDOMINIO
        sync: false
      - key: KOMMO_TOKEN
        sync: false
      - key: KOMMO_CHAVE_WEBHOOK
        generateValue: true
      - key: KOMMO_FUNIL_ID
        sync: false
      - key: KOMMO_ETAPA_NEGOCIACAO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
