<title>Torque Fisioterapia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra lateral petróleo (logo + módulos) · área de trabalho clara · fichas e formulários abrem num painel lateral. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#e8eeec; --line:#d3dcd9; --fg:#132220; --muted:#5a6b68;
  --brand:#0e3a39; --accent:#d9561f; --accent-ink:#ffffff; --accent-soft:#fbe5d9;
  --nav:#0c2b2a; --nav-2:#143d3b; --nav-fg:#e7f0ee; --nav-muted:#93b0ab;
  --ok:#1d7a4c; --ok-soft:#dbefe3; --warn:#9a5c00; --warn-soft:#fbefd8; --bad:#b3261e; --bad-soft:#f8e0de;
  --info:#2264b8; --info-soft:#dfeaf8; --off:#7b8785; --off-soft:#e9edec;
  --font-display:"Archivo","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1514; --surface:#10201f; --surface-2:#172b29; --line:#24403d; --fg:#e4eeec; --muted:#97aeaa;
  --brand:#7fd1c7; --accent:#f07a43; --accent-ink:#1a0c05; --accent-soft:#3a2216;
  --nav:#061110; --nav-2:#0f2422; --nav-fg:#e4eeec; --nav-muted:#86a39f;
  --ok:#6fcf97; --ok-soft:#12301f; --warn:#f0b35a; --warn-soft:#352610; --bad:#f2867e; --bad-soft:#3a1a19;
  --info:#7fb1f5; --info-soft:#14273f; --off:#8a9896; --off-soft:#1b2928; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1514; --surface:#10201f; --surface-2:#172b29; --line:#24403d; --fg:#e4eeec; --muted:#97aeaa;
  --brand:#7fd1c7; --accent:#f07a43; --accent-ink:#1a0c05; --accent-soft:#3a2216;
  --nav:#061110; --nav-2:#0f2422; --nav-fg:#e4eeec; --nav-muted:#86a39f;
  --ok:#6fcf97; --ok-soft:#12301f; --warn:#f0b35a; --warn-soft:#352610; --bad:#f2867e; --bad-soft:#3a1a19;
  --info:#7fb1f5; --info-soft:#14273f; --off:#8a9896; --off-soft:#1b2928; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-stretch:112%;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:16px;font-weight:800}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--font-body);font-stretch:normal}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
/* Barra lateral */
.side{background:var(--nav);color:var(--nav-fg);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-family:var(--font-display);font-stretch:112%;font-weight:800;font-size:17px;letter-spacing:.02em;line-height:1;display:block}
.brand small{display:block;color:var(--nav-muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--nav-muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--nav-2);color:var(--nav-fg)}
.nav a.on{background:var(--nav-2);color:var(--nav-fg);box-shadow:inset 3px 0 0 #f07a43}
.side-foot{margin-top:auto;font-size:12px;color:var(--nav-muted);display:flex;flex-direction:column;gap:6px}
.side-foot .pill{align-self:flex-start}
/* Área principal */
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.wa{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--surface)}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=tel],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.tools input,.tools select{width:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;margin-top:4px}
.kpi small{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--off-soft);color:var(--off)}
.st-agendado{background:var(--info-soft);color:var(--info)}
.st-confirmado{background:var(--accent-soft);color:var(--accent)}
.st-atendido,.st-pago,.st-ativo{background:var(--ok-soft);color:var(--ok)}
.st-faltou,.st-vencido{background:var(--bad-soft);color:var(--bad)}
.st-pendente{background:var(--warn-soft);color:var(--warn)}
.st-cancelado,.st-alta,.st-inativo{background:var(--off-soft);color:var(--off)}
.cbar{flex:none;width:6px;height:38px;border-radius:4px;border:0;padding:0;background:var(--cb);cursor:pointer;transition:background .2s}
.cbar:hover{filter:brightness(1.15)}
.lgbar{display:inline-block;width:5px;height:14px;border-radius:3px;background:var(--cb)}
.li small.tel{font-size:12px;color:var(--fg)}
.contato{display:flex;gap:12px;align-items:center}.contato .cbar{height:56px;width:8px}
.tel-big{font-size:17px;font-weight:600;user-select:all}
.nb{font-style:normal;margin-left:auto;background:#f07a43;color:#1a0c05;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
/* Chat */
.chat{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.rooms{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rooms>button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.rooms>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rooms>button:hover{background:var(--surface-2);color:var(--fg)}.rooms>button.on{background:var(--brand);color:var(--surface)}
.rooms .nova{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.rooms .nova input{padding:6px 8px}
.conv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;padding:0 0 10px}
.conv-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{height:calc(100vh - 340px);min-height:280px;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:min(620px,88%);align-self:flex-start;background:var(--surface-2);border-radius:12px 12px 12px 4px;padding:7px 11px}
.msg.mine{align-self:flex-end;background:var(--accent-soft);border-radius:12px 12px 4px 12px}
.mh{display:flex;align-items:center;gap:6px;font-size:12px}.mh .muted{font-size:11px}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.mdel{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0;margin-left:auto}.mdel:hover{color:var(--bad)}
.msep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;font-weight:600;margin:6px 0}.msep::before,.msep::after{content:"";flex:1;height:1px;background:var(--line)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.composer textarea{flex:1;min-width:200px;min-height:44px}
@media (max-width:760px){.chat{grid-template-columns:minmax(0,1fr)}.rooms{flex-direction:row;overflow-x:auto}.rooms>button{white-space:nowrap;flex:none}.rooms .nova{display:none}.msgs{height:55vh}}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--pc,var(--muted))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{font-family:var(--font-mono);font-weight:600;width:48px;flex:none}
.li .m{flex:1;min-width:0}
.li .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:8px}
.alert b{display:block}
.alert.warn{background:var(--warn-soft)}.alert.bad{background:var(--bad-soft)}.alert.ok{background:var(--ok-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);padding:10px 14px;border-radius:var(--r)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbar{display:grid;grid-template-columns:minmax(90px,160px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hbar .bar{height:12px}
/* Agenda */
.cal{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 210px)}
.cal-in{display:grid;min-width:max-content}
.cal-hd{position:sticky;top:0;z-index:3;background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;min-width:0}
.cal-hd.today{color:var(--accent)}
.cal-hd.corner{left:0;z-index:4}
.cal-times{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
.cal-times div{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px)}
.cal-col{position:relative;border-right:1px solid var(--line);cursor:copy;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--slot)}
.ev{position:absolute;border-radius:6px;padding:3px 6px 3px 14px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--sc) 22%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 45%,transparent);color:var(--fg)}
.ev .cbar{position:absolute;left:0;top:0;bottom:0;width:8px;height:auto;border-radius:6px 0 0 6px}
.ev:hover{z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.faltou{opacity:.6}.ev.faltou b{text-decoration:line-through}
.ev.atendido::after{content:"✓";position:absolute;right:5px;top:3px;color:var(--ok);font-weight:800}
.ev.cancelado{opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* Prontuário */
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;flex:none}
.ph .info{flex:1;min-width:200px}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.rec{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.rec-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;align-content:start;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;background:var(--surface-2)}
label.chipc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer;background:var(--surface)}
label.chipc:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
label.chipc input{margin:0}
.adendo{border-left:3px solid var(--line);padding-left:10px;font-size:13px}
.eva{display:flex;align-items:center;gap:10px}
.eva input{flex:1}
.eva output{font-family:var(--font-mono);font-weight:600;width:44px;text-align:center;padding:3px;border-radius:6px;background:var(--surface-2)}
.mini-t td,.mini-t th{padding:5px 6px}
.mini-t input,.mini-t select{padding:5px 7px}
/* Testes e linha do tempo */
.tb{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;margin:1px}
.tb.pos{background:var(--bad-soft);color:var(--bad)}.tb.neg{background:var(--ok-soft);color:var(--ok)}
.tchip{display:inline-flex;align-items:center;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.tchip.pos{background:var(--bad-soft);color:var(--bad)}.tchip.neg{background:var(--ok-soft);color:var(--ok)}
.tchip.win{box-shadow:inset 0 0 0 1.5px var(--ok)}.tchip.lose{box-shadow:inset 0 0 0 1.5px var(--bad)}
.tm th,.tm td{text-align:center;white-space:nowrap}
.tm th:first-child,.tm td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.tm th:first-child{background:var(--surface-2)}
.tm tr.reg td{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left}
.tl{list-style:none;margin:0;padding:0 0 0 44px;position:relative;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-i{position:relative;min-width:0}
.tl-m{position:absolute;left:-44px;top:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:12px;background:var(--surface);border:2px solid var(--brand);color:var(--brand)}
.tl-i.aval .tl-m{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl-i.falta .tl-m{border-color:var(--bad);color:var(--bad);width:24px;height:24px;left:-40px;font-size:11px}
.tl-c{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tl-i.aval .tl-c{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tl-i.falta .tl-c{background:transparent;border-style:dashed;padding:6px 12px}
.tl-eva{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.evab{position:relative;height:8px;border-radius:99px;background:var(--surface-2);width:160px;max-width:100%;overflow:hidden}
.evab i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.evab .pre{background:color-mix(in srgb,var(--accent) 30%,transparent)}.evab .pos{background:var(--accent)}
/* Painel lateral (modal) */
.ov{position:fixed;inset:0;background:rgba(5,15,14,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:calc(14px + env(safe-area-inset-top,0px)) 14px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.drawer-b{padding-block:18px 30px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

}
async function del(col,id){

async function syncReceita(a){
  const fin=real.financeiro.find(f=>f.agendaId===a.id);

}

function layoutLanes(evs){
  evs.sort((a,b)=>a.s-b.s||a.e-b.e);let cluster=[],end=-1;const laneEnd=[];
  const flush=()=>{const n=Math.max(...cluster.map(e=>e.lane))+1;cluster.forEach(e=>e.n=n);cluster=[];laneEnd.length=0};
  for(const e of evs){if(cluster.length&&e.s>=end)flush();let l=laneEnd.findIndex(x=>x<=e.s);if(l<0){l=laneEnd.length;laneEnd.push(0)}laneEnd[l]=e.e;e.lane=l;cluster.push(e);end=Math.max(end,e.e)}
  if(cluster.length)flush();
}

function evaChart(pts){
  const W=560,H=180,l=28,r=24,t=12,b=26,n=pts.length,x=i=>l+(n===1?0:i*(W-l-r)/(n-1)),y=v=>t+(10-num(v))*(H-t-b)/10;
  const grid=[0,2,4,6,8,10].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("");
  const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");
  const step=Math.max(1,Math.ceil(n/7));
  const lbl=pts.map((p,i)=>i%step===0||i===n-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtD(p.d).slice(0,5)}</text>`:"").join("");
  const last=pts[n-1];
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px" role="img" aria-label="Curva de dor">${grid}<polygon points="${x(0)},${y(0)} ${line} ${x(n-1)},${y(0)}" fill="var(--accent)" fill-opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===n-1?4.5:2.6}" fill="var(--accent)"/>`).join("")}<text x="${x(n-1)-6}" y="${y(last.v)-9}" text-anchor="end" style="fill:var(--fg);font-weight:600">EVA ${esc(last.v)}</text>${lbl}</svg></div><div class="muted" style="font-size:12.5px">Primeiro registro: EVA ${esc(pts[0].v)} · atual: EVA ${esc(last.v)} (${num(pts[0].v)-num(last.v)>=0?"−":"+"}${Math.abs(num(pts[0].v)-num(last.v))} pontos)</div>`;
}

function calcMes(m){
  const s=S(),ag=s.agenda.filter(a=>mesDe(a.data)===m);
  const porProf=CFG.profissionais.map(p=>{const A=ag.filter(a=>a.profId===p.id);const at=A.filter(a=>a.status==="atendido");const prod=at.reduce((x,a)=>x+(a.tipo==="pacote"?0:num(a.valor)),0)+s.financeiro.filter(f=>f.tipo==="receita"&&f.profId===p.id&&!f.agendaId&&mesDe(f.data)===m).reduce((x,f)=>x+num(f.valor),0);return{p,at:at.length,fl:A.filter(a=>a.status==="faltou").length,prod,com:p.socio?0:prod*num(p.comissao)/100}});
  const rec=s.financeiro.filter(f=>f.tipo==="receita"&&f.status==="pago"&&mesDe(f.pagoEm||f.data)===m).reduce((x,f)=>x+num(f.valor),0);
  const desp=s.financeiro.filter(f=>f.tipo==="despesa"&&f.status==="pago"&&mesDe(f.pagoEm||f.data)===m).reduce((x,f)=>x+num(f.valor),0);
  const com=porProf.reduce((x,r)=>x+r.com,0);
  return{ag,porProf,rec,desp,com,lucro:rec-desp-com};
}
VIEWS.relatorios=()=>{
  const s=S(),m=UI.rMes,c=calcMes(m),ag=c.ag;
  const at=ag.filter(a=>a.status==="atendido"),fl=ag.filter(a=>a.status==="faltou").length,cc=ag.filter(a=>a.status==="cancelado").length;
  const novos=s.pacientes.filter(p=>mesDe(p.criadoEm)===m);
  const grp=(arr,key)=>{const o={};arr.forEach(x=>{const k=key(x)||"—";o[k]=o[k]||{n:0,v:0};o[k].n++;o[k].v+=x.tipo==="pacote"?0:num(x.valor)});return Object.entries(o).sort((a,b)=>b[1].n-a[1].n)};
  const porConv=grp(at,a=>a.tipo==="convenio"?((pac(a.pacienteId)||{}).convenio||"Convênio"):a.tipo==="pacote"?"Pacote":"Particular");
  const porServ=grp(at,a=>serv(a.servicoId).nome);
  const origem={};novos.forEach(p=>{const k=p.comoConheceu||"Não informado";origem[k]=(origem[k]||0)+1});
  const maxP=Math.max(1,...c.porProf.map(r=>r.prod));
  const socios=CFG.profissionais.filter(p=>p.socio),somaCota=socios.reduce((x,p)=>x+num(p.cota),0);
  const bars=(rows,max,fmt)=>rows.map(([k,v])=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><span class="num">${fmt(v)}</span></div>`).join("");
  return `<div class="head"><div><h1>Relatórios</h1><div class="sub">${esc(mesNome(m))}</div></div><div class="tools"><input type="month" id="r-mes" value="${m}" onchange="this.value&&T.ui('rMes',this.value)" style="width:auto"><button class="btn ghost" onclick="T.csvAgenda()">Exportar atendimentos (CSV)</button></div></div>
  <div class="kpis"><div class="kpi"><span>Atendimentos</span><b>${at.length}</b></div><div class="kpi"><span>Faltas</span><b>${fl}</b><small>${at.length+fl?Math.round(fl/(at.length+fl)*100):0}% dos agendados</small></div><div class="kpi"><span>Cancelamentos</span><b>${cc}</b></div><div class="kpi"><span>Pacientes novos</span><b>${novos.length}</b></div><div class="kpi"><span>Ticket médio</span><b>${brl(at.filter(a=>a.tipo!=="pacote").length?at.filter(a=>a.tipo!=="pacote").reduce((x,a)=>x+num(a.valor),0)/at.filter(a=>a.tipo!=="pacote").length:0)}</b></div></div>
  <div class="card"><div class="card-h"><h2>Fechamento do mês e divisão entre sócios</h2>${somaCota!==100?`<span class="pill st-pendente">As cotas somam ${somaCota}%: ajuste em Ajustes</span>`:""}</div>
   <div class="grid g2"><dl class="kv"><dt>Receitas recebidas</dt><dd class="num" style="color:var(--ok)">${brl(c.rec)}</dd><dt>Despesas pagas</dt><dd class="num" style="color:var(--bad)">− ${brl(c.desp)}</dd><dt>Comissões de colaboradores</dt><dd class="num" style="color:var(--bad)">− ${brl(c.com)}</dd><dt style="color:var(--fg)">Resultado líquido</dt><dd class="num" style="font-weight:700;font-size:16px">${brl(c.lucro)}</dd></dl>
   <div class="tbl-wrap"><table><thead><tr><th>Sócio(a)</th><th class="r">Cota</th><th class="r">Produção</th><th class="r">Distribuição</th></tr></thead><tbody>${socios.map(p=>{const r=c.porProf.find(x=>x.p.id===p.id)||{prod:0};return `<tr><td><span class="dot" style="--pc:${esc(p.cor)}"></span> ${esc(p.nome)}</td><td class="r num">${num(p.cota)}%</td><td class="r num">${brl(r.prod)}</td><td class="r num"><b>${brl(c.lucro*num(p.cota)/100)}</b></td></tr>`}).join("")}</tbody></table></div></div>
   <p class="muted" style="font-size:12.5px;margin:10px 0 0">Distribuição = resultado líquido × cota de cada sócio. Produção mostra quanto cada um atendeu no mês, para conferência e para regras de distribuição por produtividade, se a sociedade adotar.</p></div>
  <div class="grid g2">
   <div class="card"><h2 style="margin-bottom:10px">Produção por fisioterapeuta</h2>${bars(c.porProf.map(r=>[r.p.nome,r.prod]),maxP,brl)}<div class="tbl-wrap" style="margin-top:12px"><table class="mini-t"><thead><tr><th>Profissional</th><th class="r">Atend.</th><th class="r">Faltas</th><th class="r">Comissão</th></tr></thead><tbody>${c.porProf.map(r=>`<tr><td>${esc(r.p.nome)}</td><td class="r num">${r.at}</td><td class="r num">${r.fl}</td><td class="r num">${r.p.socio?"sócio":brl(r.com)}</td></tr>`).join("")}</tbody></table></div></div>
   <div class="card"><h2 style="margin-bottom:10px">Atendimentos por convênio</h2>${porConv.length?bars(porConv.map(([k,v])=>[k,v.n]),Math.max(...porConv.map(x=>x[1].n)),v=>v):`<div class="empty">Sem atendimentos.</div>`}
    <h2 style="margin:18px 0 10px">Por serviço</h2>${porServ.length?bars(porServ.map(([k,v])=>[k,v.n]),Math.max(...porServ.map(x=>x[1].n)),v=>v):`<div class="empty">Sem atendimentos.</div>`}
    <h2 style="margin:18px 0 10px">Como os pacientes novos chegaram</h2>${Object.keys(origem).length?bars(Object.entries(origem).sort((a,b)=>b[1]-a[1]),Math.max(...Object.values(origem)),v=>v):`<div class="empty">Nenhum paciente novo no mês.</div>`}</div>
  </div>`;
};

/* ---------- Chat da equipe ---------- */
const meuId=()=>LOCAL?"local":(ME||"anon");
const vistos=()=>lsGet("torque.chatVisto",{});
function naoLidas(sala){const v=vistos(),me=meuId();return real.chat.filter(m=>(!sala||m.sala===sala)&&m.autorId!==me&&String(m.em)>String(v[m.sala]||"")).length}
const hhmm=iso=>{const d=new Date(iso);return isNaN(d)?"":String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const diaDe=iso=>{const d=new Date(iso);return isNaN(d)?"":iso_local(d)};
const iso_local=d=>iso(d);
VIEWS.chat=()=>{
  if(!CFG.salas.includes(UI.sala))UI.sala=CFG.salas[0]||"Geral";
  if(!UI.chatProf||!CFG.profissionais.some(p=>p.id===UI.chatProf))UI.chatProf=lsGet("torque.chatProf",(profs()[0]||{}).id);
  const me=meuId(),sala=UI.sala;
  const msgs=real.chat.filter(m=>m.sala===sala).sort((a,b)=>String(a.em).localeCompare(String(b.em)));
  let dia="";
  const lista=msgs.map(m=>{const d=diaDe(m.em),pr=prof(m.profId),mine=m.autorId===me;const sep=d!==dia?`<div class="msep"><span>${d===today()?"Hoje":d===addDays(today(),-1)?"Ontem":esc(dLong(d))}</span></div>`:"";dia=d;
    return sep+`<div class="msg ${mine?"mine":""}"><div class="mh"><span class="dot" style="--pc:${esc(pr.cor)}"></span><b>${esc(pr.nome)}</b><span class="muted num">${hhmm(m.em)}</span>${mine?`<button type="button" class="mdel" onclick="T.chatDel('${m.id}')" aria-label="Apagar mensagem">apagar</button>`:""}</div><div class="mt">${esc(m.texto)}</div></div>`}).join("");
  return `<div class="head"><div><h1>Chat da equipe</h1><div class="sub">Conversas entre os profissionais da clínica, separadas por sala. Registros clínicos vão no prontuário.</div></div></div>
  <div class="chat">
   <div class="rooms">${CFG.salas.map(r=>{const n=naoLidas(r);return `<button type="button" class="${r===sala?"on":""}" onclick="T.ui('sala',this.dataset.r)" data-r="${esc(r)}"><span># ${esc(r)}</span>${n?`<i class="nb">${n}</i>`:""}</button>`}).join("")}
    <form class="nova" onsubmit="event.preventDefault();T.novaSala(this)"><input type="text" id="chat-nova" name="nome" placeholder="Nova sala" maxlength="40"><button class="btn sm">Criar</button></form></div>
   <div class="conv"><div class="conv-h"><h2># ${esc(sala)}</h2><span class="muted">${msgs.length} mensagem(ns)</span></div>
    <div class="msgs" id="chat-msgs" onscroll="T.chatScroll(this)">${lista||`<div class="empty">Nenhuma mensagem em # ${esc(sala)} ainda.<br>Escreva a primeira abaixo.</div>`}</div>
    <form class="composer" onsubmit="event.preventDefault();T.chatSend()">
     <label class="f" style="flex:none">Falo como<select id="chat-prof" onchange="T.chatProf(this.value)">${profs(true).map(p=>opt(p.id,p.nome,UI.chatProf)).join("")}</select></label>
     <textarea id="chat-txt" rows="2" placeholder="Mensagem para # ${esc(sala)} (Enter envia, Shift+Enter quebra linha)" oninput="T.ui2('chatDraft',this.value)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();T.chatSend()}">${esc(UI.chatDraft||"")}</textarea>
     <button class="btn pri">Enviar</button></form>
    ${LOCAL?`<p class="muted" style="margin:8px 16px 0;font-size:12px">Modo local: as mensagens ficam só neste navegador. No Claude, o chat é compartilhado entre os sócios.</p>`:""}
   </div></div>`;
};
function chatAfter(){
  const box=$("#chat-msgs");if(box&&UI.chatStick!==false)box.scrollTop=box.scrollHeight;
  const ult=real.chat.filter(m=>m.sala===UI.sala).reduce((x,m)=>String(m.em)>x?String(m.em):x,"");
  const v=vistos();if(ult&&String(v[UI.sala]||"")<ult){v[UI.sala]=ult;lsSet("torque.chatVisto",v);renderNav()}
}

/* ================= Painel lateral (formulários) ================= */
function drawer(title,body,foot,onsubmit){
  $("#modal").innerHTML=`<div class="ov" onclick="if(event.target===this)T.close()"><form class="drawer" id="dw" novalidate><div class="drawer-h"><h2>${title}</h2><button type="button" class="x" onclick="T.close()" aria-label="Fechar">×</button></div><div class="drawer-b">${body}</div><div class="drawer-f">${foot}</div></form></div>`;
  const f=$("#dw");f.addEventListener("submit",e=>{e.preventDefault();onsubmit&&onsubmit(f)});
  const first=f.querySelector("input:not([type=hidden]),select,textarea");if(first)setTimeout(()=>first.focus(),30);
  return f;
}
function closeM(){$("#modal").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeM()});
const fv=(f,n)=>{const el=f.elements[n];if(!el)return"";if(el.type==="checkbox")return el.checked;return (el.value||"").trim()};
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${String(sel)===String(v)?"selected":""}>${esc(l)}</option>`;
const confirmBtn=(label,fn)=>`<button type="button" class="btn danger" onclick="if(this.dataset.c){${fn}}else{this.dataset.c=1;this.textContent='Confirmar exclusão'}">${label}</button>`;

/* ---------- Testes especiais e linha do tempo ---------- */
function testRow(k,v,mode,prev){
  v=v||{};const t=TKEYS[k]||{n:tName(k),h:""};
  const sel=(cls,val,lbl)=>`<select class="${cls}" aria-label="${esc(t.n)} ${lbl}" style="width:auto">${[["","—"],["+","+ positivo"],["-","− negativo"]].map(o=>`<option value="${o[0]}" ${val===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>`;
  const antes=prev&&(prev.d||prev.e)?`<div style="font-size:11.5px;margin-top:2px">antes: ${tBadge("D",prev.d)}${tBadge("E",prev.e)}</div>`:"";
  return `<tr data-k="${esc(k)}"><td style="min-width:170px">${mode==="re"?`<span class="muted" style="font-size:11px">${esc(tReg(k))} · </span>`:""}<b>${esc(t.n)}</b>${t.h?`<div class="muted" style="font-size:11.5px">${esc(t.h)}</div>`:""}${antes}</td><td>${sel("td",v.d||"","direito")}</td><td>${sel("te",v.e||"","esquerdo")}</td>${mode==="av"?`<td><input type="text" class="to" value="${esc(v.obs||"")}" placeholder="ex.: dor a 90°" style="min-width:120px"></td>`:""}</tr>`;

  ${matrix}
  <div class="card"><div class="card-h"><h2>Linha do tempo</h2><div class="tools"><button class="btn sm" onclick="T.openAvaliacao('${pid}')">+ Reavaliação</button><button class="btn sm pri" onclick="T.openEvolucao('${pid}')">+ Evolução</button></div></div><ol class="tl">${nodes}</ol></div>`;
}

function extenso(v){
  const u=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],dz=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],ce=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const c3=n=>{if(!n)return"";if(n===100)return"cem";const p=[],C=Math.floor(n/100),R=n%100;if(C)p.push(ce[C]);if(R)p.push(R<20?u[R]:dz[Math.floor(R/10)]+(R%10?" e "+u[R%10]:""));return p.join(" e ")};
  const int=n=>{if(!n)return"zero";const mi=Math.floor(n/1e6),mil=Math.floor(n/1e3)%1e3,r=n%1e3,p=[];if(mi)p.push(mi===1?"um milhão":c3(mi)+" milhões");if(mil)p.push(mil===1?"mil":c3(mil)+" mil");if(r)p.push(c3(r));return p.length>1&&(r<100||r%100===0)&&r?p.slice(0,-1).join(" ")+" e "+p[p.length-1]:p.join(" ")};
  const cents=Math.round(num(v)*100),R=Math.floor(cents/100),C=cents%100;const out=[];if(R)out.push(int(R)+(R===1?" real":" reais"));if(C)out.push(int(C)+(C===1?" centavo":" centavos"));return out.join(" e ")||"zero reais";
}

async function docSave(pid,kind){

  await download(`${kind}-${p.nome.replace(/[^\wÀ-ú]+/g,"-").toLowerCase()}-${today()}.html`,html,"text/html");

async function download(filename,data,type){
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){try{await dl.save({filename,data:new Blob([data],{type})});toast("Arquivo pronto.")}catch(e){if(e&&e.code!=="declined")toast("Não foi possível baixar o arquivo.")}return}
  try{const u=URL.createObjectURL(new Blob([data],{type}));const l=document.createElement("a");l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){toast("Não foi possível baixar o arquivo.")}
}

window.T={
  go,today,setStatus,openPaciente,delPaciente,openAppt,delAppt,openAvaliacao,openEvolucao,openAdendo,openFin,pagar,delFin,openDocs,docPrev,docCopy,docSave,close:closeM,
  ui(k,v){UI[k]=v;if(k==="agDate"||k==="agMode")calScrolled="";if(k==="sala")UI.chatStick=true;render()},
  ui2(k,v){UI[k]=v},
  async toggleConf(id){const a=real.agenda.find(x=>x.id===id);if(!a){toast("Este é um agendamento de exemplo.");return}if(a.status==="agendado"){a.status="confirmado";a.confirmadoEm=new Date().toISOString()}else if(a.status==="confirmado"){a.status="agendado";a.confirmadoEm=""}else{toast("Este atendimento já está como "+ST_LBL[a.status].toLowerCase()+".");return}if(await save("agenda",a)){toast(a.status==="confirmado"?"Consulta confirmada.":"Confirmação desfeita.");if($("#dw")&&$("#dw .contato")){closeM();openAppt(id)}}},
  async marca(id,campo){const a=real.agenda.find(x=>x.id===id);if(!a)return;a[campo]=new Date().toISOString();await save("agenda",a,true);setTimeout(render,600)},
  async copiar(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Copiado.")}catch(e){toast("Não foi possível copiar: "+t)}},
  copiarMsg(id){const a=S().agenda.find(x=>x.id===id);if(a)T.copiar(msgLembrete(a),"Lembrete copiado. Cole no SMS ou no WhatsApp.")},
  chatProf(v){UI.chatProf=v;lsSet("torque.chatProf",v)},
  chatScroll(el){UI.chatStick=el.scrollHeight-el.scrollTop-el.clientHeight<60},
  async chatSend(){const t=String(UI.chatDraft||"").trim();if(!t)return;if(t.length>2000){toast("Mensagem muito longa (máx. 2.000 caracteres).");return}const o={sala:UI.sala,texto:t,autorId:meuId(),profId:UI.chatProf,em:new Date().toISOString()};UI.chatDraft="";const el=$("#chat-txt");if(el)el.value="";UI.chatStick=true;if(!(await save("chat",o))){UI.chatDraft=t;if(el)el.value=t}},
  async chatDel(id){if(await del("chat",id))toast("Mensagem apagada.")},
  async novaSala(f){const n=fv(f,"nome").replace(/\s+/g," ").trim();if(!n)return;if(CFG.salas.some(x=>x.toLowerCase()===n.toLowerCase())){UI.sala=CFG.salas.find(x=>x.toLowerCase()===n.toLowerCase());render();return}CFG.salas=[...CFG.salas,n];if(await saveCfg()){UI.sala=n;render();toast("Sala # "+n+" criada.")}},
  agMove(n){UI.agDate=addDays(UI.agDate,UI.agMode==="dia"?n:7*n);calScrolled="";render()},
  calClick(e,col){const r=col.getBoundingClientRect();const m=toMin(CFG.horaIni)+Math.floor((e.clientY-r.top)/PX)*SLOT;openAppt(null,{data:col.dataset.d,profId:col.dataset.p,hora:fromMin(m)})},
  apPac(sel){const p=pac(sel.value);if(!p)return;const f=sel.form;if(p.profId)f.elements.profId.value=p.profId;f.elements.tipo.value=p.convenio?"convenio":"particular";T.apTipo(f.elements.tipo)},
  apServ(sel){const s=serv(sel.value),f=sel.form;f.elements.duracao.value=s.duracao;if(f.elements.tipo.value==="particular")f.elements.valor.value=s.valor},
  apTipo(sel){const f=sel.form;const s=serv(f.elements.servicoId.value);f.elements.valor.value=sel.value==="particular"?s.valor:sel.value==="pacote"?"":f.elements.valor.value;f.elements.valor.placeholder=sel.value==="convenio"?"valor pago pelo convênio":sel.value==="pacote"?"já pago no pacote":""},
  toggleReg(r,on){const el=$$("#dw .treg").find(x=>x.dataset.reg===r);if(el)el.hidden=!on},
  addReteste(sel,pid){const k=sel.value;sel.value="";if(!k)return;const tb=$("#t-rt tbody");if($$("tr[data-k]",tb).some(tr=>tr.dataset.k===k)){toast("Este teste já está na lista.");return}tb.insertAdjacentHTML("beforeend",testRow(k,{},"re",statusTestes(pid)[k]||{}));$("#rt-wrap").hidden=false},
  addRow(tid,p){$("#"+tid+" tbody").insertAdjacentHTML("beforeend",p==="g"?gonRow():forRow())},
  addProfRow(){$("#t-prof tbody").insertAdjacentHTML("beforeend",profRow({id:"p"+uid(),nome:"",cor:"#4a8f87",socio:false,cota:0,comissao:40,ativo:true}))},
  addServRow(){$("#t-serv tbody").insertAdjacentHTML("beforeend",servRow({id:"s"+uid(),nome:"",valor:0,duracao:50,cor:PAL[CFG.servicos.length%PAL.length]}))},
  async saveClinica(f){["nome","cnpj","telefone","endereco","cidade","email","instagram"].forEach(k=>CFG.clinica[k]=fv(f,k));CFG.horaIni=fv(f,"horaIni")||"07:00";CFG.horaFim=fv(f,"horaFim")||"21:00";if(toMin(CFG.horaFim)<=toMin(CFG.horaIni)){toast("O horário final precisa ser depois do inicial.");return}if(await saveCfg())toast("Dados da clínica salvos.")},
  async saveProfs(f){const L=$$("#t-prof tbody tr").map(tr=>{const g=n=>tr.querySelector(`[name=${n}]`);return{id:tr.dataset.id,nome:g("nome").value.trim(),crefito:g("crefito").value.trim(),especialidade:g("especialidade").value.trim(),cor:g("cor").value,socio:g("socio").checked,cota:num(g("cota").value),comissao:num(g("comissao").value),ativo:g("ativo").checked}}).filter(p=>p.nome);if(!L.length){toast("Cadastre ao menos um profissional.");return}CFG.profissionais=L;const sc=L.filter(p=>p.socio).reduce((x,p)=>x+p.cota,0);if(await saveCfg())toast(sc===100?"Profissionais salvos.":"Salvo. Atenção: as cotas dos sócios somam "+sc+"%.")},
  async saveServs(f){const L=$$("#t-serv tbody tr").map(tr=>{const g=n=>tr.querySelector(`[name=${n}]`);return{id:tr.dataset.id,cor:g("cor").value,nome:g("nome").value.trim(),valor:num(g("valor").value),duracao:num(g("duracao").value)||50}}).filter(s=>s.nome);if(!L.length){toast("Cadastre ao menos um serviço.");return}CFG.servicos=L;if(await saveCfg())toast("Serviços salvos.")},
  async saveListas(f){const sp=n=>fv(f,n).split("\n").map(x=>x.trim()).filter(Boolean);CFG.convenios=sp("convenios");CFG.catDespesa=sp("catDespesa");CFG.catReceita=sp("catReceita");const sl=sp("salas");if(sl.length)CFG.salas=sl;if(await saveCfg())toast("Listas salvas.")},
  async backup(){await download(`torque-backup-${today()}.json`,JSON.stringify({app:"torque-fisioterapia",versao:1,geradoEm:new Date().toISOString(),config:CFG,...real},null,1),"application/json")},
  async restore(file){if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=="torque-fisioterapia")throw 0;if(d.config){CFG=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),d.config);await saveCfg()}let n=0;for(const c of COLS)for(const o of d[c]||[]){if(await save(c,o,true))n++}render();toast(n+" registros restaurados.")}catch(e){toast("Arquivo inválido: escolha uma cópia gerada pelo Torque.")}},
  csvFin(){const m=UI.fMes;const L=S().financeiro.filter(f=>mesDe(f.data)===m).sort((a,b)=>a.data.localeCompare(b.data));download(`financeiro-${m}.csv`,csv([["Tipo","Vencimento","Descrição","Categoria","Forma","Valor","Status","Pago em","Profissional"],...L.map(f=>[f.tipo,fmtD(f.data),f.descricao,f.categoria,f.forma,String(num(f.valor)).replace(".",","),finStatus(f),fmtD(f.pagoEm),f.profId?prof(f.profId).nome:""])]),"text/csv")},
  csvAgenda(){const m=UI.rMes;const L=S().agenda.filter(a=>mesDe(a.data)===m).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));download(`atendimentos-${m}.csv`,csv([["Data","Hora","Paciente","Convênio","Profissional","Serviço","Cobrança","Valor","Status"],...L.map(a=>[fmtD(a.data),a.hora,pacNome(a.pacienteId),(pac(a.pacienteId)||{}).convenio||"Particular",prof(a.profId).nome,serv(a.servicoId).nome,a.tipo,String(num(a.valor)).replace(".",","),ST_LBL[a.status]])]),"text/csv")}
};

window.addEventListener("hashchange",()=>{if(route().v!=="paciente")UI.pTab="resumo";closeM();render();window.scrollTo(0,0)});
function localLoad(){LOCAL=true;COLS.forEach(c=>real[c]=lsGet("torque."+c,[]));real.chat=lsGet("torque.chat",[]);const c=lsGet("torque.config",null);if(c)CFG=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),c);$("#modo").textContent="Modo local (este navegador)"}
function ready(){loaded=true;render()}
renderNav();
(async()=>{
  const timer=setTimeout(()=>{if(!loaded){localLoad();ready()}},10000);
  db=window.claude&&window.claude.use?await window.claude.use("db").catch(()=>null):null;
  if(loaded)return;
  if(!db){clearTimeout(timer);localLoad();ready();return}
  $("#modo").textContent="Banco compartilhado · sócios";
  const user=await window.claude.use("user").catch(()=>null);
  if(user){const c=await user.can("data.write").catch(()=>null);if(c===false){canWrite=false;$("#modo").textContent="Acesso só de leitura"}ME=await user.id().catch(()=>null)}
  db.collection("chat").orderBy("em","desc").limit(500).onSnapshot(s=>{real.chat=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(loaded){if(route().v==="chat")render();else renderNav()}},()=>{});
  db.doc("config/clinica").onSnapshot(d=>{if(d.exists){CFG=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),d.data());render()}},()=>{});
  let got=0;const seen={};
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{real[c]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(!seen[c]){seen[c]=1;if(++got>=COLS.length){clearTimeout(timer);ready()}}else render()},()=>{if(!seen[c]){seen[c]=1;if(++got>=COLS.length){clearTimeout(timer);ready()}}}));
})();
})();
