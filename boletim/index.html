<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boletim Cognitivo</title>
<meta name="description" content="Acompanhe as notas do Ensino Médio no formato do Colégio Cognitivo: PP, PU, PS, recuperação e Recuperação Final — funciona sem internet.">
<meta name="theme-color" content="#021632">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boletim">
<style>
/* Paleta tirada da capa do Manual do Estudante 2026: azul-marinho + losango de 4 cores */
:root{
  --navy:#021632; --navy-2:#024E8C; --blue:#4195D7; --green:#40B93C; --red:#DB5340; --orange:#DFA244; --leaf:#4EAA64;
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#EDF2F8; --line:rgba(2,22,50,.11);
  --fg:#0A1F3A; --fg-dim:#5A6B80; --accent:#024E8C; --on-accent:#fff;
  --ok:#2F9E44; --ok-bg:#E4F5E6; --warn:#C47F12; --warn-bg:#FCF1DC; --bad:#D2453B; --bad-bg:#FBE5E2; --idle:#8696A8; --idle-bg:#EDF1F5;
  --radius:18px; --shadow:0 1px 2px rgba(2,22,50,.05),0 6px 18px rgba(2,22,50,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06111F; --surface:#0E1E33; --surface-2:#16294A; --line:rgba(190,215,245,.12);
  --fg:#E6EEF8; --fg-dim:#94A7BE; --accent:#6CB2EC; --on-accent:#03142A;
  --ok:#5BCB6A; --ok-bg:#15361D; --warn:#F0B44A; --warn-bg:#3A2D14; --bad:#FF7B6E; --bad-bg:#3E1C1A; --idle:#7D90A6; --idle-bg:#18283E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#06111F; --surface:#0E1E33; --surface-2:#16294A; --line:rgba(190,215,245,.12);
  --fg:#E6EEF8; --fg-dim:#94A7BE; --accent:#6CB2EC; --on-accent:#03142A;
  --ok:#5BCB6A; --ok-bg:#15361D; --warn:#F0B44A; --warn-bg:#3A2D14; --bad:#FF7B6E; --bad-bg:#3E1C1A; --idle:#7D90A6; --idle-bg:#18283E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}

/* Cabeçalho azul-marinho */
header.top{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:46px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:40px;transform:rotate(45deg);background:rgba(255,255,255,.04)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.brand b{font-size:17px;font-weight:600;letter-spacing:.01em}
.top h1{font-size:25px;font-weight:700;margin-top:16px;position:relative;z-index:1}
.top .sub{font-size:14px;opacity:.8;position:relative;z-index:1;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12.5px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.badge-em{display:inline-block;background:var(--green);color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:4px;margin-left:8px;vertical-align:3px}
main.wrap{margin-top:-30px;position:relative;z-index:2}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-dim);margin:22px 4px 10px}

/* Resumo */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font-size:30px;font-weight:700;line-height:1}
.ring .val span{font-size:10.5px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--fg-dim)}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.hero-msg{grid-column:1/-1;font-size:14px;color:var(--fg-dim);border-top:1px solid var(--line);padding-top:12px}
.hero-msg strong{color:var(--fg)}
@media (max-width:420px){.hero{grid-template-columns:1fr;justify-items:center}.hero-stats{width:100%}}
.units-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ustrip{padding:12px;text-align:center;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ustrip small{display:block;font-size:11.5px;color:var(--fg-dim);font-weight:600;letter-spacing:.04em}
.ustrip b{font-size:21px}
.ustrip.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

.alerts{display:grid;gap:8px;margin-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px}
.alert.bad{background:var(--bad-bg)} .alert.warn{background:var(--warn-bg)} .alert.ok{background:var(--ok-bg)} .alert.info{background:var(--surface-2);display:block}
.alert i{font-style:normal;font-size:16px;line-height:1.3}

.subjects{display:grid;gap:10px}
.subj{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;padding:13px 16px 13px 0;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);transition:transform .15s}
.subj:active{transform:scale(.985)}
.subj .bar{height:100%;min-height:44px;border-radius:0 6px 6px 0}
.subj .name{font-weight:600;font-size:16px}
.subj .meta{display:block;font-size:13px;color:var(--fg-dim);margin-top:2px}
.pills{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pill{min-width:40px;padding:3px 6px;border-radius:8px;font-size:12.5px;font-weight:600;text-align:center;background:var(--idle-bg);color:var(--idle)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.subj .avg{text-align:right}
.subj .avg b{font-size:23px;display:block;line-height:1}
.subj .avg small{font-size:11px;color:var(--fg-dim);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.idle{background:var(--idle-bg);color:var(--idle)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-idle{color:var(--idle)}

/* Seletor de unidade */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:9px 0;border-radius:10px;font-weight:600;font-size:14px;color:var(--fg-dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* Tabela do boletim */
.table-wrap{overflow-x:auto;border-radius:var(--radius);margin-top:12px}
table.bol{border-collapse:separate;border-spacing:0;width:100%;min-width:600px;font-size:14px}
.bol th,.bol td{padding:0;border-bottom:1px solid var(--line);text-align:center}
.bol thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#fff;font-weight:700;padding:11px 4px;background:var(--navy-2)}
.bol th.subjcol,.bol td.subjcol{text-align:left;padding:10px 12px;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.bol thead th.subjcol{background:var(--navy-2)}
.bol tr:last-child td{border-bottom:0}
.bol input{width:100%;min-width:50px;height:44px;border:0;background:transparent;text-align:center;font-weight:600;font-size:15px}
.bol input:focus{background:var(--surface-2);outline:none}
.bol input:disabled{opacity:.4}
.bol input.ok{color:var(--ok)} .bol input.warn{color:var(--warn)} .bol input.bad{color:var(--bad)}
.bol td.res{font-weight:700;padding:0 8px}
.bol td.dim{color:var(--fg-dim);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--fg-dim);margin:10px 4px 0}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:currentColor}

/* Formulários */
.form{display:grid}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.field:last-child{border-bottom:0}
.field label{font-size:15px}
.field small{display:block;font-size:12.5px;color:var(--fg-dim)}
.field input[type=text],.field input[type=number],.field input.num,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;width:190px;max-width:55%;text-align:right}
.field input.num,.field input[type=number]{width:84px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-btn{width:100%;margin-top:10px;border-style:dashed;color:var(--accent);background:transparent}
.hint{font-size:13px;color:var(--fg-dim);margin:8px 4px 0}

/* Navegação inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--fg-dim);border-radius:12px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Folha de detalhe */
.scrim{position:fixed;inset:0;background:rgba(2,12,26,.5);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
@media (min-width:780px){.sheet{left:50%;right:auto;width:620px;margin-left:-310px}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 4px}
.sheet-head h2{font-size:22px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.ucard{padding:14px;margin-bottom:10px}
.ucard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ucard-head h3{font-size:16px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gbox{background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:8px 4px 6px;text-align:center}
.gbox label{font-size:11px;color:var(--fg-dim);display:block;font-weight:700;letter-spacing:.04em}
.gbox input{width:100%;border:0;background:transparent;text-align:center;font-size:22px;font-weight:700;padding:2px 0}
.gbox input:focus{outline:none}
.gbox input:disabled{opacity:.35}
.gbox.ok{border-color:var(--ok)} .gbox.warn{border-color:var(--warn)} .gbox.bad{border-color:var(--bad)}
.gbox.ok input{color:var(--ok)} .gbox.warn input{color:var(--warn)} .gbox.bad input{color:var(--bad)}
.ucard .note{font-size:13.5px;color:var(--fg-dim);margin:10px 0 0}
.ucard .note b{color:var(--fg)}
.chart{padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}

/* Regras */
.rule{padding:14px 16px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule h3{font-size:15px;display:flex;align-items:center;gap:8px}
.rule h3 .k{font-size:11px;font-weight:800;color:#fff;background:var(--navy-2);border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.rule p{margin:6px 0 0;font-size:14px;color:var(--fg-dim)}
.rule p b{color:var(--fg)}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:8px;color:var(--fg)}

.calc-out{padding:18px;text-align:center}
.calc-out b.big{display:block;font-size:46px;line-height:1.1}
.empty{text-align:center;padding:36px 20px;color:var(--fg-dim)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media print{nav.tabs,.no-print{display:none!important}body{padding:0;background:#fff}header.top,.bol thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(45 20 20)"><rect x="7" y="7" width="15" height="9" rx="1.5" fill="#DB5340"/><rect x="24" y="7" width="9" height="15" rx="1.5" fill="#DFA244"/><rect x="18" y="24" width="15" height="9" rx="1.5" fill="#4195D7"/><rect x="7" y="18" width="9" height="15" rx="1.5" fill="#4EAA64"/></g></svg>
        <div><small>Colégio</small><b>Cognitivo</b></div>
      </div>
      <span class="chip" title="Os dados ficam salvos só neste aparelho"><span class="dot"></span><span id="netState">Offline OK</span></span>
    </div>
    <h1 id="title">Boletim</h1>
    <div class="sub" id="subtitle"></div>
  </div>
</header>

<main class="wrap">
  <section id="v-home"></section>
  <section id="v-table" hidden></section>
  <section id="v-calc" hidden></section>
  <section id="v-rules" hidden></section>
  <section id="v-settings" hidden></section>
</main>

<nav class="tabs no-print" aria-label="Navegação">
  <div class="in">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Resumo</button>
    <button data-tab="table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Boletim</button>
    <button data-tab="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Quanto tirar</button>
    <button data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Regras</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Ajustes</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';
/* ==========================================================
   Regras do Manual do Estudante 2026 — Ensino Médio
   • Média da Unidade = (PP + PU + PS) ÷ 3  (+ bônus SimulaCOG e LR, até 0,5 cada)
   • Unidade < 7,0 → Prova de Recuperação (PR): nova média = (média + PR) ÷ 2,
     considera-se a maior entre a média e a nova média.
   • Aprovado: soma das médias das 3 Unidades ≥ 21 pontos.
   • Senão → Recuperação Final (RF): precisa de 10 − (soma ÷ 3); aprovado se média anual + RF ≥ 10.
   • Frequência mínima: 75% das horas letivas de cada componente.
   ========================================================== */
const KEY = 'boletim-cognitivo-v1';
const UN = ['I', 'II', 'III'];
const MEDIA = 7, PONTOS = 21, MAX = 10, BONUS_MAX = 0.5, FREQ_MIN = 75, EPS = 1e-9;
const AREAS = { ling: 'Linguagens', hum: 'Humanas', nat: 'Natureza', mat: 'Matemática' };
const AREA_COLOR = { ling: '#DB5340', hum: '#DFA244', nat: '#4EAA64', mat: '#4195D7' };
const DEFAULT_SUBJECTS = [
  ['Língua Portuguesa', 'ling'], ['Literatura', 'ling'], ['Redação', 'ling'], ['Inglês', 'ling'],
  ['Matemática', 'mat'], ['Física', 'nat'], ['Química', 'nat'], ['Biologia', 'nat'],
  ['História', 'hum'], ['Geografia', 'hum'], ['Filosofia', 'hum'], ['Sociologia', 'hum'], ['Educação Física', 'ling']
];

const uid = () => Math.random().toString(36).slice(2, 9);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const emptyUnit = () => ({ pp: null, pu: null, ps: null, pr: null, faltas: 0 });
const newSubject = (nome, area) => ({ id: uid(), nome, area, cor: AREA_COLOR[area], un: [emptyUnit(), emptyUnit(), emptyUnit()], rf: null, aulas: null });

function defaults() {
  return {
    aluno: { nome: 'Lucas', serie: '1ª Série', turma: '', ano: String(new Date().getFullYear()) },
    unidadeAtual: 0,
    bonus: UN.map(() => ({ lr: null, sim: { ling: null, hum: null, nat: null, mat: null } })),
    tema: 'auto',
    materias: DEFAULT_SUBJECTS.map(([n, a]) => newSubject(n, a))
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.materias)) S = defaults();
normalize();
function normalize() {
  const d = defaults();
  S.aluno = Object.assign(d.aluno, S.aluno);
  S.unidadeAtual = [0, 1, 2].includes(S.unidadeAtual) ? S.unidadeAtual : 0;
  S.bonus = UN.map((_, i) => { const b = (S.bonus || [])[i] || {}; return { lr: b.lr ?? null, sim: Object.assign({ ling: null, hum: null, nat: null, mat: null }, b.sim) }; });

/* ---------- Cálculos ---------- */
const r2 = v => Math.round(v * 100) / 100;
const fmt = v => v == null || isNaN(v) ? '–' : v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmt2 = v => v == null || isNaN(v) ? '–' : v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
function parseNum(str, max = MAX) {
  if (str == null) return null;
  str = String(str).trim().replace(',', '.');
  if (str === '') return null;
  const v = Number(str);
  if (isNaN(v)) return undefined;
  return Math.max(0, Math.min(max, r2(v)));
}
function level(v, alvo = MEDIA) {
  if (v == null) return 'idle';
  if (v >= alvo - EPS) return 'ok';
  if (v >= alvo - 1.5) return 'warn';
  return 'bad';
}
function bonusOf(m, u) { const b = S.bonus[u]; return (b.lr || 0) + (b.sim[m.area] || 0); }

function unitStats(m, u) {
  const x = m.un[u], vals = [x.pp, x.pu, x.ps], got = vals.filter(v => v != null);
  const sum = got.reduce((a, b) => a + b, 0), bonus = bonusOf(m, u);
  const complete = got.length === 3;
  const media = complete ? Math.min(MAX, sum / 3 + bonus) : null;
  const parcial = got.length ? Math.min(MAX, sum / got.length + bonus) : null;
  const temRec = complete && media < MEDIA - EPS;
  let final = media;
  if (temRec && x.pr != null) final = Math.max(media, (media + x.pr) / 2);   // vale a maior média
  const faltam = 3 - got.length;
  const precisa = faltam ? (3 * (MEDIA - bonus) - sum) / faltam : null;     // nota igual nas provas restantes
  const precisaPR = temRec ? 2 * MEDIA - media : null;
  return { complete, media, parcial, final, temRec, precisa, faltam, precisaPR, bonus, vazia: got.length === 0, prPendente: temRec && x.pr == null };
}
function stats(m) {
  const us = UN.map((_, u) => unitStats(m, u));
  const fechadas = us.filter(s => s.complete);
  const pontos = fechadas.reduce((a, s) => a + s.final, 0);
  const allDone = fechadas.length === 3;
  const disp = us.map(s => s.final ?? s.parcial).filter(v => v != null);
  const mediaAnual = disp.length ? disp.reduce((a, b) => a + b, 0) / disp.length : null;
  const faltas = m.un.reduce((a, x) => a + (x.faltas || 0), 0);
  const freq = m.aulas ? Math.max(0, 100 * (1 - faltas / m.aulas)) : null;
  const freqBaixa = freq != null && freq < FREQ_MIN;
  const podeFaltar = m.aulas ? Math.floor(m.aulas * (1 - FREQ_MIN / 100)) - faltas : null;
  let situacao, nivel, precisaUnid = null, precisaRF = null, finalAno = null;
  if (allDone) {
    finalAno = pontos / 3;
    if (pontos >= PONTOS - EPS) { situacao = 'Aprovado'; nivel = 'ok'; }
    else {
      precisaRF = MAX - finalAno;
      if (m.rf == null) { situacao = 'Recuperação Final'; nivel = 'bad'; }
      else if (finalAno + m.rf >= MAX - EPS) { situacao = 'Aprovado na RF'; nivel = 'ok'; }
      else { situacao = 'Reprovado'; nivel = 'bad'; }
    }
  } else {
    precisaUnid = (PONTOS - pontos) / (3 - fechadas.length);
    if (us.every(s => s.vazia)) { situacao = 'Sem notas'; nivel = 'idle'; }
    else if (precisaUnid <= 0) { situacao = 'Aprovação garantida'; nivel = 'ok'; }
    else if (precisaUnid > MAX) { situacao = 'Rumo à RF'; nivel = 'bad'; }
    else if (us.some(s => s.prPendente)) { situacao = 'Recuperação da unidade'; nivel = 'warn'; }
    else if ((mediaAnual ?? 0) >= MEDIA - EPS) { situacao = 'No caminho'; nivel = 'ok'; }
    else { situacao = 'Atenção'; nivel = 'warn'; }
  }
  if (freqBaixa) { nivel = 'bad'; situacao += ' · faltas'; }
  return { us, pontos, fechadas: fechadas.length, allDone, mediaAnual, finalAno, faltas, freq, freqBaixa, podeFaltar, situacao, nivel, precisaUnid, precisaRF };
}

let openId = null;

function closeSheet() {

$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openId) closeSheet(); });
function unitNote(s, m, u) {

  if (!s.complete) {
    if (s.precisa <= 0) return `🎉 Média 7,0 garantida nesta unidade.`;
    if (s.precisa > MAX) return `Mesmo tirando 10 não fecha 7,0 — vai para a <b>PR</b>. Tire o máximo possível.`;
    return `Precisa de <b class="c-${s.precisa > MEDIA ? 'warn' : 'ok'}">${fmt(s.precisa)}</b> ${s.faltam === 1 ? 'na prova que falta' : 'em cada uma das ' + s.faltam + ' provas que faltam'} para fechar 7,0.`;
  }
  if (!s.temRec) return `Média da unidade <b class="c-ok">${fmt2(s.media)}</b> ✓`;

  return `Média ${fmt2(s.media)} — na PR precisa de <b class="c-warn">${fmt(s.precisaPR)}</b> para chegar a 7,0. Se a PR for menor, fica a maior média.`;

function renderSheet() {

  const s = stats(m);
  let anual;
  if (s.allDone) anual = s.precisaRF != null
    ? (m.rf == null ? `Somou <b class="c-bad">${fmt2(s.pontos)}</b> de 21 pontos. Na <b>Recuperação Final</b> precisa de <b>${fmt(s.precisaRF)}</b> (10 − ${fmt2(s.finalAno)}).` : `Média anual ${fmt2(s.finalAno)} + RF ${fmt2(m.rf)} = <b class="c-${s.nivel}">${fmt2(s.finalAno + m.rf)}</b> → <span class="tag ${s.nivel}">${s.situacao}</span>`)
    : `<span class="tag ok">Aprovado</span> com <b>${fmt2(s.pontos)}</b> pontos (média ${fmt2(s.finalAno)}).`;
  else if (s.fechadas === 0) anual = `Para passar direto: <b>21 pontos</b> somando as 3 unidades (média 7,0 em cada).`;
  else if (s.precisaUnid <= 0) anual = `🎉 Já tem ${fmt2(s.pontos)} pontos — aprovação garantida!`;
  else anual = `Tem <b>${fmt2(s.pontos)}</b> pontos. Faltam <b>${fmt2(PONTOS - s.pontos)}</b> → média <b class="c-${s.precisaUnid > MAX ? 'bad' : s.precisaUnid > MEDIA ? 'warn' : 'ok'}">${fmt(s.precisaUnid)}</b> ${3 - s.fechadas === 1 ? 'na última unidade' : 'em cada unidade restante'}.${s.precisaUnid > MAX ? ' Não dá para passar direto — haverá RF.' : ''}`;

  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab"></div><div class="wrap">
    <div class="sheet-head"><h2 id="sheetTitle"><span style="color:${esc(m.cor)}">●</span> ${esc(m.nome)}</h2><button class="icon-btn" id="closeSheet" aria-label="Fechar">✕</button></div>
    <div class="alert info" style="margin:6px 0 12px">${anual}</div>
    ${s.us.map((x, u) => `
      <div class="card ucard">
        <div class="ucard-head"><h3>${UN[u]} Unidade${u === S.unidadeAtual ? ' <span class="tag idle">atual</span>' : ''}</h3><span class="tag ${x.complete ? level(x.final) : 'idle'}">${x.complete ? fmt2(x.final) : (x.parcial == null ? 'sem notas' : '~' + fmt(x.parcial))}</span></div>
        <div class="grades">${['pp', 'pu', 'ps', 'pr'].map(k => { const v = m.un[u][k], dis = k === 'pr' && !x.temRec; return `<div class="gbox ${dis ? '' : level(v)}"><label for="g${u}${k}">${k.toUpperCase()}</label><input id="g${u}${k}" inputmode="decimal" data-u="${u}" data-k="${k}" value="${v == null ? '' : fmt2(v)}" placeholder="–" ${dis ? 'disabled' : ''}></div>`; }).join('')}</div>
        <p class="note">${unitNote(x, m, u)}${x.bonus ? ` <span class="tag ok">+${fmt2(x.bonus)} bônus</span>` : ''}</p>
      </div>`).join('')}
    ${s.precisaRF != null ? `<div class="card ucard"><div class="ucard-head"><h3>Recuperação Final</h3><span class="tag ${m.rf == null ? 'warn' : s.nivel}">precisa ${fmt(s.precisaRF)}</span></div><div class="grades" style="grid-template-columns:1fr"><div class="gbox ${m.rf == null ? '' : s.nivel}"><label for="grf">NOTA DA RF</label><input id="grf" inputmode="decimal" data-k="rf" value="${m.rf == null ? '' : fmt2(m.rf)}" placeholder="–"></div></div></div>` : ''}
    <h3 class="section-title">Evolução por unidade</h3>
    <div class="card chart">${chartSVG(m, s)}</div>
    <h3 class="section-title">Frequência (mínimo 75%)</h3>
    <div class="card form">
      <div class="field"><label for="aulas">Aulas previstas no ano<small>Opcional — para calcular a frequência</small></label><input type="number" id="aulas" min="0" value="${m.aulas ?? ''}" placeholder="ex.: 80"></div>
      ${m.un.map((x, u) => `<div class="field"><label>Faltas na ${UN[u]} Unidade</label><span style="display:flex;align-items:center;gap:8px"><button class="icon-btn" data-f="${u}" data-d="-1" aria-label="Menos uma falta">−</button><b style="min-width:24px;text-align:center">${x.faltas || 0}</b><button class="icon-btn" data-f="${u}" data-d="1" aria-label="Mais uma falta">+</button></span></div>`).join('')}
      <div class="field"><label>Total</label><span style="text-align:right"><b class="${s.freqBaixa ? 'c-bad' : ''}">${s.faltas} falta${s.faltas === 1 ? '' : 's'}</b>${s.freq != null ? ` · ${fmt(s.freq)}%` : ''}${s.podeFaltar != null ? `<small>${s.podeFaltar >= 0 ? 'pode faltar mais ' + s.podeFaltar : 'limite de 25% ultrapassado'}</small>` : ''}</span></div>
    </div>
    <h3 class="section-title">Disciplina</h3>
    <div class="card form">
      <div class="field"><label for="sname">Nome</label><input type="text" id="sname" value="${esc(m.nome)}"></div>
      <div class="field"><label for="sarea">Área (SimulaCOG)</label><select id="sarea">${Object.entries(AREAS).map(([k, n]) => `<option value="${k}" ${m.area === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label>Cor</label><div class="swatches">${['#DB5340', '#DFA244', '#4EAA64', '#4195D7', '#024E8C', '#7A4FD0', '#D04F8E', '#5A6B78'].map(c => `<button class="sw" style="background:${c}" data-c="${c}" aria-label="Cor" aria-pressed="${c === m.cor}"></button>`).join('')}</div></div>
    </div>
    <div class="btn-row" style="margin-top:14px"><button class="btn danger" id="delSubj">Excluir</button><button class="btn primary" id="doneSubj">Pronto</button></div>
  </div>`;
  $('#closeSheet').onclick = $('#doneSubj').onclick = closeSheet;
  const order = ['pp', 'pu', 'ps', 'pr'];
  sh.querySelectorAll('.gbox input').forEach(inp => {
    inp.addEventListener('change', () => {
      const v = parseNum(inp.value);
      if (v === undefined) { toast('Nota inválida'); inp.value = ''; return; }
      if (inp.dataset.k === 'rf') m.rf = v; else m.un[+inp.dataset.u][inp.dataset.k] = v;
      save(); keepScroll(renderSheet);
    });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const nx = sh.querySelector(`#g${inp.dataset.u}${order[order.indexOf(inp.dataset.k) + 1]}`);
      nx && !nx.disabled ? nx.focus() : inp.blur();
    });
  });
  sh.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { const x = m.un[+b.dataset.f]; x.faltas = Math.max(0, (x.faltas || 0) + +b.dataset.d); save(); keepScroll(renderSheet); });
  $('#aulas').onchange = e => { const v = parseInt(e.target.value, 10); m.aulas = v > 0 ? v : null; save(); keepScroll(renderSheet); };
  $('#sname').onchange = e => { m.nome = e.target.value.trim() || m.nome; save(); keepScroll(renderSheet); };
  $('#sarea').onchange = e => { m.area = e.target.value; save(); keepScroll(renderSheet); };
  sh.querySelectorAll('.sw').forEach(b => b.onclick = () => { m.cor = b.dataset.c; save(); keepScroll(renderSheet); });
  $('#delSubj').onclick = () => { if (confirm(`Excluir "${m.nome}" e todas as notas?`)) { S.materias = S.materias.filter(x => x !== m); save(); closeSheet(); toast('Disciplina excluída'); } };
}
function keepScroll(fn) { const sh = $('#sheet'), y = sh.scrollTop; fn(); sh.scrollTop = y; }
function chartSVG(m, s) {
  const W = 320, H = 160, pl = 26, pr = 18, pt = 18, pb = 24;
  const x = i => pl + 30 + i * (W - pl - pr - 60) / 2, y = v => pt + (1 - v / MAX) * (H - pt - pb);
  let g = '';
  [0, 5, 10].forEach(v => g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--fg-dim)">${v}</text>`);
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(MEDIA)}" y2="${y(MEDIA)}" stroke="var(--green)" stroke-dasharray="4 4"/><text x="${W - pr}" y="${y(MEDIA) - 4}" font-size="10" text-anchor="end" fill="var(--green)">meta 7,0</text>`;
  s.us.forEach((u, i) => {
    [['pp', -1], ['pu', 0], ['ps', 1]].forEach(([k, o]) => { const v = m.un[i][k]; if (v != null) g += `<rect x="${x(i) + o * 13 - 5}" y="${y(v)}" width="10" height="${Math.max(0, y(0) - y(v))}" rx="3" fill="${esc(m.cor)}" opacity="${.3 + (o + 1) * .12}"><title>${k.toUpperCase()} ${fmt2(v)}</title></rect>`; });
    g += `<text x="${x(i)}" y="${H - 6}" font-size="10.5" text-anchor="middle" fill="var(--fg-dim)">${UN[i]} Unid.</text>`;
  });
  const pts = s.us.map((u, i) => { const v = u.final ?? u.parcial; return v == null ? null : [x(i), y(v), v]; }).filter(Boolean);
  if (pts.length > 1) g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join('')}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" opacity=".55"/>`;
  pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="var(--surface)" stroke="var(--fg)" stroke-width="2.5"/><text x="${p[0]}" y="${p[1] - 11}" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--fg)">${fmt(p[2])}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Notas de ${esc(m.nome)} por unidade">${g}</svg><p class="hint" style="margin:4px 0 0">Barras: PP, PU e PS · Ponto: média da unidade</p>`;
}
function addSubject() {
  const nome = prompt('Nome da disciplina:');
  if (!nome || !nome.trim()) return;
  const m = newSubject(nome.trim(), 'ling'); S.materias.push(m); save(); render(); openSubject(m.id);
}

/* ---------- Quanto tirar (simulador) ---------- */
let calc = { id: null };
function renderCalc() {
  const el = $('#v-calc');
  if (!calc.id || !S.materias.find(m => m.id === calc.id)) calc.id = S.materias[0]?.id || null;
  const m = S.materias.find(x => x.id === calc.id);
  if (!m) { el.innerHTML = '<div class="card empty">Adicione disciplinas para usar o simulador.</div>'; return; }
  const u = S.unidadeAtual, s = stats(m), us = s.us[u], x = m.un[u];
  const faltando = ['pp', 'pu', 'ps'].filter(k => x[k] == null).map(k => k.toUpperCase());
  let big, txt, lv;
  if (!us.complete) {
    if (us.precisa <= 0) { big = '✓'; lv = 'ok'; txt = `Média 7,0 garantida na ${UN[u]} Unidade!`; }
    else { big = fmt(us.precisa); lv = us.precisa > MAX ? 'bad' : us.precisa > MEDIA ? 'warn' : 'ok'; txt = `${faltando.length === 1 ? 'na ' + faltando[0] : 'em cada prova restante (' + faltando.join(', ') + ')'} para fechar 7,0 na ${UN[u]} Unidade.${us.precisa > MAX ? ' Não dá sem PR.' : ''}`; }
  } else if (us.prPendente) { big = fmt(us.precisaPR); lv = us.precisaPR > MAX ? 'bad' : 'warn'; txt = `na <b>Prova de Recuperação</b> da ${UN[u]} Unidade (média atual ${fmt2(us.media)}).`; }
  else if (s.precisaRF != null && m.rf == null) { big = fmt(s.precisaRF); lv = 'bad'; txt = `na <b>Recuperação Final</b>.`; }
  else { big = '✓'; lv = 'ok'; txt = `${UN[u]} Unidade fechada com ${fmt2(us.final)}.`; }

  el.innerHTML = `
    <div class="card form">
      <div class="field"><label for="calcSel">Disciplina</label><select id="calcSel">${S.materias.map(z => `<option value="${z.id}" ${z.id === calc.id ? 'selected' : ''}>${esc(z.nome)}</option>`).join('')}</select></div>
      <div class="field"><label for="calcU">Unidade</label><select id="calcU">${UN.map((n, i) => `<option value="${i}" ${i === u ? 'selected' : ''}>${n} Unidade</option>`).join('')}</select></div>
    </div>
    <div class="card calc-out" style="margin-top:12px"><span class="hint">Você precisa de</span><b class="big c-${lv}">${big}</b><div>${txt}</div></div>
    <h3 class="section-title">No ano</h3>
    <div class="card" style="padding:14px 16px;font-size:15px">${s.allDone ? (s.precisaRF != null ? `Somou ${fmt2(s.pontos)} pts. RF: precisa de <b>${fmt(s.precisaRF)}</b>.` : `Aprovado com ${fmt2(s.pontos)} pontos ✓`) : `Pontos fechados: <b>${fmt2(s.pontos)}</b> de 21. ${s.precisaUnid <= 0 ? 'Aprovação garantida 🎉' : `Precisa de média <b class="c-${s.precisaUnid > MAX ? 'bad' : s.precisaUnid > MEDIA ? 'warn' : 'ok'}">${fmt(s.precisaUnid)}</b> ${3 - s.fechadas === 1 ? 'na unidade restante' : 'nas ' + (3 - s.fechadas) + ' unidades restantes'}.`}`}</div>
    <h3 class="section-title">Simulador da ${UN[u]} Unidade</h3>
    <div class="card" style="padding:16px">
      ${['pp', 'pu', 'ps'].map(k => { const v = x[k] ?? MEDIA; return `<label style="display:flex;justify-content:space-between;font-size:14px;font-weight:600"><span>${k.toUpperCase()}${x[k] != null ? ' <span class="tag idle">lançada</span>' : ''}</span><span id="sv-${k}">${fmt(v)}</span></label><input type="range" min="0" max="10" step="0.5" value="${v}" data-sim="${k}" style="width:100%;margin:4px 0 12px" aria-label="${k.toUpperCase()} simulada">`; }).join('')}
      <div id="simOut" style="font-size:15px;border-top:1px solid var(--line);padding-top:12px"></div>
    </div>
    <p class="hint">Inclui os bônus (LR + SimulaCOG) lançados na aba Boletim. Regras do Manual do Estudante 2026.</p>`;
  $('#calcSel').onchange = e => { calc.id = e.target.value; renderCalc(); };
  $('#calcU').onchange = e => { S.unidadeAtual = +e.target.value; bolView = null; save(); render(); };
  const upd = () => {
    const vals = {}; el.querySelectorAll('[data-sim]').forEach(r => { vals[r.dataset.sim] = +r.value; $('#sv-' + r.dataset.sim).textContent = fmt(+r.value); });
    const bonus = bonusOf(m, u), media = Math.min(MAX, (vals.pp + vals.pu + vals.ps) / 3 + bonus);
    $('#simOut').innerHTML = `Média da unidade: <b class="c-${level(media)}">${fmt2(media)}</b>${bonus ? ` (com +${fmt2(bonus)} de bônus)` : ''} — ${media >= MEDIA - EPS ? 'passa direto ✓' : `iria para a PR (precisaria de ${fmt(2 * MEDIA - media)})`}.`;
  };
  el.querySelectorAll('[data-sim]').forEach(r => r.oninput = upd); upd();
}

/* ---------- Regras (resumo do manual) ---------- */
function renderRules() {
  $('#v-rules').innerHTML = `
    <div class="card">
      <div class="rule"><h3><span class="k">PP</span> Prova Parcial</h3><p>Por disciplina, questões <b>discursivas</b>. Às sextas a partir das 7h (ou contraturno).</p></div>
      <div class="rule"><h3><span class="k">PU</span> Prova de Unidade</h3><p>Por blocos de área, <b>múltipla escolha</b> (a–e). Às sextas a partir das 7h.</p></div>
      <div class="rule"><h3><span class="k">PS</span> Prova Simulativa</h3><p>Estilo <b>SSA/UPE</b>, múltipla escolha, nota de 0 a 10 por disciplina, conteúdo acumulativo.</p></div>
      <div class="rule"><h3>📐 Média da Unidade</h3><div class="formula">(PP + PU + PS) ÷ 3 ≥ 7,0</div></div>
      <div class="rule"><h3><span class="k">PR</span> Recuperação da Unidade</h3><p>Para quem ficou abaixo de 7,0 na unidade. Conteúdo acumulativo da unidade.</p><div class="formula">Nova média = (média + PR) ÷ 2<br>Ex.: (6,0 + 8,0) ÷ 2 = 7,0<br>Se a PR baixar a média, vale a maior.</div></div>
      <div class="rule"><h3>✅ Aprovação</h3><div class="formula">I + II + III ≥ 21 pontos</div></div>
      <div class="rule"><h3><span class="k">RF</span> Recuperação Final</h3><p>Para quem somou menos de 21 pontos. Conteúdo das 3 unidades, questões discursivas.</p><div class="formula">Precisa tirar = 10 − (soma ÷ 3)<br>Ex.: 5 + 6 + 4 = 15 → 15 ÷ 3 = 5 → precisa de 5,0</div></div>
      <div class="rule"><h3>⭐ Bônus</h3><p><b>SimulaCOG</b> (simulados extras, opcionais): até <b>0,5</b> na média, por área do conhecimento. <b>Laboratório de Redação</b>: até <b>0,5</b> em todas as disciplinas (média das produções da unidade).</p></div>
      <div class="rule"><h3>📅 Frequência</h3><p>Mínimo de <b>75%</b> de presença em cada componente. Acima de 25% de faltas há risco de reprovação.</p></div>
    </div>
    <h3 class="section-title">Prazos importantes</h3>
    <div class="card">
      <div class="rule"><h3><span class="k">2ª CH</span> Segunda Chamada</h3><p>Requerimento na recepção em até <b>48h</b>, assinado pelo responsável. Taxa de <b>R$ 30</b> por disciplina ou atestado médico. Não existe para PR, RF e SimulaCOG. Correção em até 15 dias úteis.</p></div>
      <div class="rule"><h3>✉️ Contestar questão</h3><p>Até <b>48h</b> após a prova, por e-mail à Coordenação.</p></div>
      <div class="rule"><h3>🔁 Revisão da correção</h3><p>Pedir ao professor em até <b>5 dias</b> após receber a prova. Notas de unidades anteriores não são corrigidas depois do fim do ano.</p></div>
      <div class="rule"><h3>📄 Boletim oficial</h3><p>Sai em até <b>10 dias úteis</b> depois do fim de cada unidade.</p></div>
      <div class="rule"><h3>📵 Celular na prova</h3><p>Nota <b>zero</b> em todas as provas do dia.</p></div>
    </div>
    <p class="hint" style="text-align:center;margin:16px 0">Fonte: Manual do Estudante – Ensino Médio, Ano Letivo 2026. Em caso de dúvida, vale o que a Coordenação informar.</p>`;
}

/* ---------- Ajustes ---------- */
function renderSettings() {
  const a = S.aluno;
  $('#v-settings').innerHTML = `
    <h3 class="section-title" style="margin-top:8px">Estudante</h3>
    <div class="card form">
      <div class="field"><label for="a-nome">Nome</label><input type="text" id="a-nome" data-a="nome" value="${esc(a.nome)}"></div>
      <div class="field"><label for="a-serie">Série</label><select id="a-serie" data-a="serie">${['1ª Série', '2ª Série', '3ª Série'].map(x => `<option ${a.serie === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="a-turma">Turma</label><input type="text" id="a-turma" data-a="turma" value="${esc(a.turma)}" placeholder="ex.: A"></div>
      <div class="field"><label for="a-ano">Ano letivo</label><input type="text" id="a-ano" data-a="ano" value="${esc(a.ano)}" inputmode="numeric"></div>
      <div class="field"><label for="a-un">Unidade atual</label><select id="a-un">${UN.map((n, i) => `<option value="${i}" ${S.unidadeAtual === i ? 'selected' : ''}>${n} Unidade</option>`).join('')}</select></div>
    </div>
    <h3 class="section-title">Aparência</h3>
    <div class="card form"><div class="field"><label for="c-tema">Tema</label><select id="c-tema">
      <option value="auto" ${S.tema === 'auto' ? 'selected' : ''}>Automático</option><option value="light" ${S.tema === 'light' ? 'selected' : ''}>Claro</option><option value="dark" ${S.tema === 'dark' ? 'selected' : ''}>Escuro</option></select></div></div>
    <h3 class="section-title">Seus dados</h3>
    <div class="card" style="padding:14px;display:grid;gap:10px">
      <p class="hint" style="margin:0">Tudo fica salvo <b>só neste aparelho</b>, sem internet e sem cadastro. Faça backup antes de trocar de celular.</p>
      <div class="btn-row"><button class="btn" id="exp">⬇️ Fazer backup</button><button class="btn" id="imp">⬆️ Restaurar</button></div>
      <button class="btn" id="newYear">🗓️ Novo ano letivo (zera notas)</button>
      <button class="btn danger" id="reset">Apagar tudo</button>
    </div>
    <p class="hint" style="text-align:center;margin:20px 0">Funciona offline · No celular: menu do navegador → “Adicionar à Tela de Início”.<br>App pessoal de acompanhamento — o boletim oficial é o do Colégio.</p>`;
  document.querySelectorAll('[data-a]').forEach(i => i.onchange = () => { S.aluno[i.dataset.a] = i.value.trim(); save(); render(); });
  $('#a-un').onchange = e => { S.unidadeAtual = +e.target.value; bolView = null; save(); render(); };
  $('#c-tema').onchange = e => { S.tema = e.target.value; save(); render(); };
  $('#exp').onclick = exportData;
  $('#imp').onclick = () => $('#importFile').click();
  $('#newYear').onclick = () => {
    if (!confirm('Zerar todas as notas, bônus e faltas para um novo ano? As disciplinas ficam. Dica: faça backup antes.')) return;
    S.materias.forEach(m => { m.un = [emptyUnit(), emptyUnit(), emptyUnit()]; m.rf = null; });
    S.bonus = defaults().bonus; S.unidadeAtual = 0; bolView = null; S.aluno.ano = String((+S.aluno.ano || new Date().getFullYear()) + 1);
    save(); render(); toast('Novo ano iniciado!');
  };
  $('#reset').onclick = () => { if (confirm('Apagar TODOS os dados deste aparelho?')) { S = defaults(); bolView = null; save(); go('home'); toast('Dados apagados'); } };
}
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `boletim-${(S.aluno.nome || 'estudante').toLowerCase().replace(/\s+/g, '-')}-${S.aluno.ano}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup salvo');
}
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.materias)) throw 0; S = d; normalize(); bolView = null; save(); go('home'); toast('Backup restaurado!'); }
    catch (err) { toast('Arquivo de backup inválido'); }
    e.target.value = '';
  };
  r.readAsText(f);
};

function applyTheme() { if (S.tema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.tema); }
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }
function net() { $('#netState').textContent = navigator.onLine ? 'Salvo no aparelho' : 'Offline · tudo OK'; }
addEventListener('online', net); addEventListener('offline', net); net();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
})();
</script>
</body>
</html>
